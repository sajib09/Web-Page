<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
            background-color: #f4f4f4;
        }
        header, footer {
            background: #333;
            color: white;
            padding: 15px;
        }
        .pricing {
            margin: 50px auto;
            width: 60%;
            background: white;
            padding: 20px;
            box-shadow: 0 0 20px rgba(155, 5, 5, 0.1);
            border-radius: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: rgb(37, 3, 189);
            color: white;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
    </style>
</head>
<body>
    <header>
        <h1>Our Services</h1>
    </header>

    <main>
        <section class="pricing">
            <h2>Our Pricing</h2>
            <table>
              <thead>
                <tr>
                  <th>Service</th>
                  <th>Price</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>Web Design</td>
                  <td>$500</td>
                </tr>
                <tr>
                  <td>Web Development</td>
                  <td>$1000</td>
                </tr>
                <tr>
                  <td>SEO Optimization</td>
                  <td>$300</td>
                </tr>
              </tbody>
            </table>
          </section>
    </main>

    <footer>
        <p>&copy; 2025 My Static Website | Designed with (❁´◡`❁)</p>
    </footer>
</body>
</html>
